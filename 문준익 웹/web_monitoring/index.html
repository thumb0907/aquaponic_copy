<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Automated Aquaponics Dashboard
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>
</head>

<body>

  <div class="dashboard">

    <!-- =================================================
         상단 헤더
    ================================================== -->

    <header class="topbar">

      <div class="topbar-left">
        <h1>
          Automated Aquaponics System
        </h1>
      </div>

      <div class="topbar-right">

        <div class="time-box">

          <div class="time-label">
            Current Time
          </div>

          <div
            id="currentTime"
            class="time-value"
          >
            --:--:--
          </div>

        </div>

      </div>

    </header>


    <!-- =================================================
         메인 화면
    ================================================== -->

    <main class="main-grid">


      <!-- =================================================
           좌측 타임랩스 영상
      ================================================== -->

      <section class="left-panel">

        <div class="panel-title">
          Timelapse Monitoring
        </div>


        <!-- 타임랩스 영상 1 -->

        <div class="camera-card">

          <div class="camera-header">

            <span>
              수경재배 타임랩스
            </span>

            <span class="camera-status">
              LOOP
            </span>

          </div>

          <div class="camera-view">

            <video
              id="timelapseVideo1"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            >

              <source
                src="/videos/timelapse1.mp4"
                type="video/mp4"
              >

              브라우저가 영상 재생을
              지원하지 않습니다.

            </video>

          </div>

        </div>


        <!-- 타임랩스 영상 2 -->

        <div class="camera-card">

          <div class="camera-header">

            <span>
              발아실 타임랩스
            </span>

            <span class="camera-status">
              LOOP
            </span>

          </div>

          <div class="camera-view">

            <video
              id="timelapseVideo2"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            >

              <source
                src="/videos/timelapse2.mp4"
                type="video/mp4"
              >

              브라우저가 영상 재생을
              지원하지 않습니다.

            </video>

          </div>

        </div>

      </section>


      <!-- =================================================
           중앙 센서 대시보드
      ================================================== -->

      <section class="center-panel">

        <div class="panel-title">
          Sensor Dashboard
        </div>


        <!-- 현재 센서값 -->

        <div class="summary-cards">


          <!-- 수위 -->

          <div class="summary-card">

            <div class="summary-label">
              수위
            </div>

            <div class="summary-value">

              <span id="levelValue">
                -
              </span>

              mm

            </div>

            <div class="summary-unit">
              정상 범위: 280 ~ 380 mm
            </div>

          </div>


          <!-- 수온 -->

          <div class="summary-card">

            <div class="summary-label">
              수온
            </div>

            <div class="summary-value">

              <span id="tempValue">
                -
              </span>

              °C

            </div>

            <div class="summary-unit">
              정상 범위: 22 ~ 28°C
            </div>

          </div>


          <!-- pH -->

          <div class="summary-card">

            <div class="summary-label">
              pH
            </div>

            <div class="summary-value">

              <span id="phValue">
                -
              </span>

            </div>

            <div class="summary-unit">
              정상 범위: 6.4 ~ 7.4
            </div>

          </div>


          <!-- TDS -->

          <div class="summary-card">

            <div class="summary-label">
              TDS
            </div>

            <div class="summary-value">

              <span id="tdsValue">
                -
              </span>

              ppm

            </div>

            <div class="summary-unit">
              정상 범위: 580 ~ 780 ppm
            </div>

          </div>

        </div>


        <!-- 센서 그래프 -->

        <div class="chart-grid">


          <!-- 수위 그래프 -->

          <div class="chart-card">

            <div class="chart-title">
              수위 그래프
            </div>

            <div class="chart-wrap">
              <canvas id="levelChart"></canvas>
            </div>

          </div>


          <!-- 수온 그래프 -->

          <div class="chart-card">

            <div class="chart-title">
              수온 그래프
            </div>

            <div class="chart-wrap">
              <canvas id="tempChart"></canvas>
            </div>

          </div>


          <!-- pH 그래프 -->

          <div class="chart-card">

            <div class="chart-title">
              pH 그래프
            </div>

            <div class="chart-wrap">
              <canvas id="phChart"></canvas>
            </div>

          </div>


          <!-- TDS 그래프 -->

          <div class="chart-card">

            <div class="chart-title">
              TDS 그래프
            </div>

            <div class="chart-wrap">
              <canvas id="tdsChart"></canvas>
            </div>

          </div>

        </div>

      </section>


      <!-- =================================================
           우측 이벤트 로그
      ================================================== -->

      <section class="right-panel">

        <div class="panel-title">
          Event Log
        </div>

        <div class="log-box full-log-box">

          <div class="log-header-row">

            <div class="info-title">
              실시간 이벤트 로그
            </div>

            <button
              id="clearLogBtn"
              class="clear-log-btn"
              type="button"
            >
              로그 비우기
            </button>

          </div>

          <div
            id="eventLog"
            class="log-list"
          ></div>

        </div>

      </section>

    </main>

  </div>

  <script src="/script.js"></script>

</body>

</html>
