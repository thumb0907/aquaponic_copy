<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #c8d1dc; stroke-width: 2; rx: 10; }
      .pc { fill: #e8f2ff; stroke: #3678b8; stroke-width: 2; rx: 10; }
      .pi { fill: #eaf7ed; stroke: #3b8a4d; stroke-width: 2; rx: 10; }
      .dev { fill: #fff4df; stroke: #b8791f; stroke-width: 2; rx: 10; }
      .dds { fill: #f0edff; stroke: #7357c5; stroke-width: 2; rx: 10; }
      .cam { fill: #fcebea; stroke: #b84f44; stroke-width: 2; rx: 10; }
      .title { font: 700 34px "Malgun Gothic", "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .h1 { font: 700 24px "Malgun Gothic", "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .h2 { font: 700 18px "Malgun Gothic", "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .txt { font: 15px "Malgun Gothic", "Segoe UI", Arial, sans-serif; fill: #263442; }
      .small { font: 13px "Malgun Gothic", "Segoe UI", Arial, sans-serif; fill: #445160; }
      .topic { font: 700 14px "Consolas", "Malgun Gothic", monospace; fill: #17202a; }
      .wire { stroke: #3c4c5c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire2 { stroke: #7357c5; stroke-width: 4; fill: none; marker-end: url(#arrowPurple); }
      .tcp { stroke: #b84f44; stroke-width: 3; fill: none; stroke-dasharray: 9 6; marker-end: url(#arrowRed); }
      .uart { stroke: #b8791f; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .subtle { fill: #e9eef5; stroke: #c8d1dc; stroke-width: 1; rx: 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3c4c5c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7357c5"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b84f44"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b8791f"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="60" y="60">Aquaponics ROS2 DDS 통신 구조도</text>
  <text class="txt" x="60" y="92">PC master_node가 ROS2 Topic을 발행/구독하고, DDS/RTPS가 PC와 Raspberry Pi 노드 사이의 pub/sub 전송을 담당한다.</text>

  <rect class="panel" x="40" y="125" width="1320" height="235"/>
  <text class="h1" x="70" y="165">ROS2 DDS Domain</text>
  <rect class="dds" x="515" y="190" width="360" height="120"/>
  <text class="h1" x="565" y="225">DDS / RTPS Middleware</text>
  <text class="txt" x="555" y="255">Topic discovery, publish, subscribe</text>
  <text class="small" x="555" y="282">QoS depth 10 in current nodes</text>

  <rect class="pc" x="75" y="190" width="335" height="120"/>
  <text class="h1" x="115" y="225">PC: smartfarm_master</text>
  <text class="topic" x="115" y="255">master_node.py</text>
  <text class="small" x="115" y="282">flag router, vision 판단, monitor publish</text>

  <rect class="pi" x="980" y="155" width="300" height="78"/>
  <text class="h2" x="1015" y="185">Pi1: smartfarm_pi1</text>
  <text class="small" x="1015" y="211">STM1 UART + nursery cameras</text>
  <rect class="pi" x="980" y="250" width="300" height="78"/>
  <text class="h2" x="1015" y="280">Pi2: pi2_pkg</text>
  <text class="small" x="1015" y="306">STM2 / SCARA / manip UART</text>

  <path class="wire2" d="M410 215 C470 205, 470 205, 515 220"/>
  <path class="wire2" d="M875 220 C925 205, 925 190, 980 190"/>
  <text class="topic" x="435" y="195">/pi1/uart_cmd</text>
  <text class="topic" x="885" y="174">/pi1/uart_response</text>
  <path class="wire2" d="M410 270 C470 285, 470 285, 515 278"/>
  <path class="wire2" d="M875 278 C925 295, 925 290, 980 290"/>
  <text class="topic" x="435" y="310">/pi2/uart_cmd</text>
  <text class="topic" x="885" y="322">/pi2/uart_response</text>

  <rect class="panel" x="40" y="395" width="1320" height="375"/>
  <text class="h1" x="70" y="435">현장 장치 게이트웨이</text>

  <rect class="pi" x="90" y="470" width="245" height="120"/>
  <text class="h2" x="125" y="505">Pi1 Node</text>
  <text class="small" x="125" y="532">sub: /pi1/uart_cmd</text>
  <text class="small" x="125" y="555">pub: /pi1/uart_response</text>

  <rect class="dev" x="440" y="470" width="250" height="120"/>
  <text class="h2" x="480" y="505">STM1 Cartesian</text>
  <text class="small" x="480" y="532">/dev/stm1, 115200bps</text>
  <text class="small" x="480" y="555">STATE / DONE / ERR / FLAG</text>
  <path class="uart" d="M335 530 L440 530"/>
  <text class="topic" x="356" y="515">UART frame</text>

  <rect class="pi" x="90" y="635" width="245" height="120"/>
  <text class="h2" x="125" y="670">Pi2 Node</text>
  <text class="small" x="125" y="697">target byte routing</text>
  <text class="small" x="125" y="720">0x01 SCARA, 0x03 STM2</text>

  <rect class="dev" x="440" y="620" width="250" height="75"/>
  <text class="h2" x="480" y="650">STM2 Conveyor</text>
  <text class="small" x="480" y="675">/dev/stm2, binary frame</text>
  <rect class="dev" x="440" y="710" width="250" height="75"/>
  <text class="h2" x="480" y="740">SCARA / Manip</text>
  <text class="small" x="480" y="765">/dev/scara, /dev/manip</text>
  <path class="uart" d="M335 665 L440 655"/>
  <path class="uart" d="M335 705 L440 747"/>

  <rect class="pi" x="790" y="470" width="245" height="120"/>
  <text class="h2" x="825" y="505">Pi3 Node</text>
  <text class="small" x="825" y="532">sub: /pi3/uart_cmd</text>
  <text class="small" x="825" y="555">pub: /pi3/sensor_data</text>

  <rect class="dev" x="1110" y="470" width="210" height="120"/>
  <text class="h2" x="1145" y="505">STM3 Sensor Hub</text>
  <text class="small" x="1145" y="532">/dev/ttyACM0</text>
  <text class="small" x="1145" y="555">문자열 센서 데이터</text>
  <path class="uart" d="M1035 530 L1110 530"/>

  <rect class="cam" x="790" y="650" width="245" height="95"/>
  <text class="h2" x="825" y="685">Camera Streams</text>
  <text class="small" x="825" y="712">TCP JPEG stream</text>
  <rect class="subtle" x="1110" y="635" width="210" height="125"/>
  <text class="h2" x="1145" y="670">PC Vision Threads</text>
  <text class="small" x="1145" y="697">CAM1 5000</text>
  <text class="small" x="1145" y="720">Nursery 5001/5002</text>
  <text class="small" x="1145" y="743">Pi3 CAM2/3 also 5001/5002</text>
  <path class="tcp" d="M1035 697 L1110 697"/>

  <rect class="panel" x="40" y="800" width="1320" height="62"/>
  <text class="h2" x="70" y="835">핵심 흐름</text>
  <text class="txt" x="195" y="835">PC 명령: master_node → ROS2 DDS Topic → Pi gateway → UART/TCP 현장 장치</text>
  <text class="txt" x="730" y="835">장치 응답: STM/SCARA → Pi parser → ROS2 DDS Topic → master_node flags</text>
</svg>
